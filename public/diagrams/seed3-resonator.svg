<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 820" role="img" aria-labelledby="title desc"><title id="title">Resonant prototype — Daisy Seed 3 control map</title><desc id="desc">Seed 3 Eurorack Dev Kit, front view. VR1: Root, C1–C6. VR2: Resonance, Q 2–250. VR3: Band 1, excitation. VR4: Band 2, excitation. VR5: Band 3, excitation. VR6: Band 4, excitation. VR7: Band 5, excitation. VR8: Band 6, excitation. SW1: Next bank. SW2: Next chord. SW3: Octave. SW4: Freeze. Gate 1: freeze. Gate 2: noise ping. CV 1: chord rotation. CV 2: resonance. CV outputs held at zero. MIDI and SD unused. Stereo audio inputs and outputs at lower right.</desc>
